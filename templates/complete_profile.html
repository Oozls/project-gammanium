{% extends "base.html" %}

{% block title %}프로필 완성 - 사제동행 런닝 프로그램{% endblock %}

{% block content %}

<!-- ===========================================================
     COMPLETE PROFILE PAGE
=========================================================== -->
<section class="section" style="padding-top: calc(var(--space-20) + var(--space-6)); padding-bottom: var(--space-20);">
  <div class="container container-sm">

    <!-- Form card -->
    <div class="card" style="max-width: 540px; margin-left: auto; margin-right: auto;">

      <!-- Header -->
      <div style="text-align: center; margin-bottom: var(--space-8);">
        <h2 style="margin-bottom: var(--space-2);">프로필 완성</h2>
        <p class="text-sm">계정을 완성하기 위해 학번과 역할 정보를 입력해주세요</p>
      </div>

      <!-- Form -->
      <form method="POST" style="display: flex; flex-direction: column; gap: var(--space-5);">

        <!-- Role field -->
        <div class="form-group">
          <label class="form-label required">역할</label>
          <select name="role" class="form-input" required>
            <option value="">역할을 선택하세요</option>
            <option value="student">학생</option>
            <option value="teacher">교사</option>
          </select>
        </div>

        <!-- Student ID field -->
        <div class="form-group">
          <label class="form-label required">학번</label>
          <input
            type="text"
            name="student_id"
            class="form-input"
            placeholder="학번 (예: 30209)"
            pattern="[123]0[1-8](0[1-9]|[1-2][0-9]|3[0-9])"
            maxlength="5"
            required
          />
          <p class="form-hint">형식: 학년(1-3) + 0 + 반(1-8) + 번호(01-39)</p>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary btn-lg btn-full">
          <i data-feather="check"></i>
          저장하기
        </button>

      </form>

    </div>

  </div>
</section>

{% endblock %}
